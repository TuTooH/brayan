<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Melanie</title>
<meta name="theme-color" content="#6E4351">
<meta name="description" content="Una sorpresa hecha a mano.">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --noche:      #6E4351;   /* fondo, palo rosa */
  --brasa:      #8E5668;   /* degradado superior, más rosado y claro */
  --durazno:    #FBE2CE;   /* texto principal */
  --rosa:       #FFB9B4;   /* acento */
  --dorado:     #F8D3A0;   /* corazones y borde del botón */
  --crema:      #FFF9F4;   /* énfasis */
  --sombra:     rgba(52,26,34,.65);

  --display: "Fraunces", Georgia, serif;
  --texto:   "Karla", -apple-system, BlinkMacSystemFont, sans-serif;

  --ancho: 34rem;
  --curva: 1rem;
  --suave: cubic-bezier(.22,.61,.36,1);
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }

body{
  background:
    radial-gradient(120% 60% at 50% 0%, var(--brasa) 0%, var(--noche) 62%),
    var(--noche);
  background-attachment:fixed;
  color:var(--durazno);
  font-family:var(--texto);
  font-weight:300;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* Mientras el candado está cerrado nadie puede espiar la carta */
body.bloqueado{ overflow:hidden; height:100svh; }
body.bloqueado .escenario{ visibility:hidden; }

::selection{ background:var(--rosa); color:var(--noche); }

/* Lienzo de los corazones: siempre detrás, nunca capturable */
#escena{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* ============================================================
   PORTAL — candado y pregunta trampa
   ============================================================ */
.portal{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:2.5rem;
  padding:1.6rem;
  text-align:center;
  background:
    radial-gradient(120% 60% at 50% 0%, var(--brasa) 0%, var(--noche) 62%),
    var(--noche);
  transition:opacity 1s var(--suave);
}

.portal.abriendo{ opacity:0; pointer-events:none; }
.portal[hidden]{ display:none; }

.epigrafe{
  font-size:.72rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--rosa);
  opacity:0;
  animation:entrar 1.2s var(--suave) .3s forwards;
}

@keyframes entrar{ to{ opacity:1; } }

/* ============================================================
   EL CANDADO
   ============================================================ */
.cerradura{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1.6rem;
}

.candado{
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* El arco: media pastilla hueca que sale por detrás del cuerpo */
.candado__arco{
  width:7rem;
  height:4.4rem;
  border:.62rem solid color-mix(in srgb, var(--crema) 48%, transparent);
  border-bottom:0;
  border-radius:3.5rem 3.5rem 0 0;
  margin-bottom:-.8rem;
  transform-origin:88% 100%;
  transition:transform .45s var(--suave);
}

/* Al acertar, el arco se destraba antes de que todo estalle */
.candado.destrabado .candado__arco{ transform:translateY(-.9rem) rotate(17deg); }

.candado__cuerpo{
  position:relative;
  z-index:1;
  padding:1.5rem 1.1rem 1.4rem;
  border-radius:1.5rem;
  background:linear-gradient(158deg,
              color-mix(in srgb, var(--crema) 20%, transparent),
              color-mix(in srgb, var(--crema) 7%, transparent));
  border:1px solid color-mix(in srgb, var(--crema) 26%, transparent);
  box-shadow:inset 0 1px 0 color-mix(in srgb, var(--crema) 26%, transparent),
             0 26px 50px -26px var(--sombra);
}

/* Los dos remaches: el detalle que termina de leerse como candado */
.candado__cuerpo::before,
.candado__cuerpo::after{
  content:"";
  position:absolute;
  bottom:.55rem;
  width:.3rem;
  height:.3rem;
  border-radius:50%;
  background:color-mix(in srgb, var(--crema) 30%, transparent);
}
.candado__cuerpo::before{ left:.55rem; }
.candado__cuerpo::after { right:.55rem; }

.ruedas{
  display:flex;
  gap:.6rem;
}

.rueda{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.15rem;
  padding:.45rem .3rem;
  min-width:3.9rem;
  border-radius:.75rem;
  background:color-mix(in srgb, var(--noche) 45%, transparent);
  border:1px solid color-mix(in srgb, var(--crema) 14%, transparent);
  box-shadow:inset 0 2px 8px color-mix(in srgb, var(--sombra) 60%, transparent);
}

.flecha{
  appearance:none;
  background:none;
  border:0;
  cursor:pointer;
  padding:.3rem .6rem;
  font-size:.7rem;
  line-height:1;
  color:color-mix(in srgb, var(--durazno) 60%, transparent);
  transition:color .2s ease, transform .15s ease;
}
.flecha:hover, .flecha:focus-visible{ color:var(--crema); }
.flecha:active{ transform:scale(.86); }
.flecha:focus-visible{ outline:2px solid var(--rosa); outline-offset:2px; border-radius:.4rem; }

.digito{
  font-family:var(--display);
  font-size:2.4rem;
  font-weight:400;
  line-height:1.1;
  color:var(--crema);
  font-variant-numeric:tabular-nums;
  user-select:none;
  cursor:pointer;
}

/* Cada giro da un saltito: confirma que el toque se registró */
.digito.gira{ animation:girar .28s var(--suave); }
@keyframes girar{
  0%  { transform:translateY(35%); opacity:.2; }
  100%{ transform:none;            opacity:1;  }
}

.pista-clave{
  font-size:.78rem;
  letter-spacing:.06em;
  color:color-mix(in srgb, var(--durazno) 60%, transparent);
  max-width:22rem;
}

/* ---------- La explosión del candado ---------- */
.candado.estalla{ animation:estallar .7s var(--suave) forwards; pointer-events:none; }

@keyframes estallar{
  0%  { transform:scale(1)    rotate(0);      filter:none; }
  20% { transform:scale(.9)   rotate(-2.5deg);              }
  48% { transform:scale(1.2)  rotate(2.5deg); filter:brightness(2); }
  100%{ transform:scale(1.75) rotate(-7deg);  filter:brightness(2.6) blur(7px); opacity:0; }
}

/* Capa compartida por las esquirlas y por los corazones que explotan */
.particulas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:30;
}

.esquirla{
  position:absolute;
  border-radius:2px;
  animation:salir .95s cubic-bezier(.15,.7,.3,1) forwards;
}

@keyframes salir{
  0%  { transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1; }
  100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
                  scale(.15) rotate(var(--giro)); opacity:0; }
}

/* Corazón hecho con dos lóbulos: se ve nítido a cualquier tamaño */
.chispa{
  position:absolute;
  animation:volar 1.5s cubic-bezier(.12,.66,.3,1) forwards;
}
.chispa::before,
.chispa::after{
  content:"";
  position:absolute;
  width:50%;
  height:80%;
  border-radius:50% 50% 0 0;
  background:currentColor;
}
.chispa::before{ left:0;  transform:rotate(-45deg); transform-origin:100% 100%; }
.chispa::after { right:0; transform:rotate(45deg);  transform-origin:0 100%; }

@keyframes volar{
  0%  { transform:translate(-50%,-50%) scale(.2)  rotate(0); opacity:0; }
  15% { transform:translate(-50%,-50%) scale(1.1) rotate(0); opacity:1; }
  100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
                  scale(.35) rotate(var(--giro)); opacity:0; }
}

/* ---------- La pregunta trampa ---------- */
.pregunta{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2.5rem;
  opacity:0;
  transform:translateY(14px);
  transition:opacity .9s var(--suave), transform .9s var(--suave);
}
.pregunta[hidden]{ display:none; }
.pregunta.visible{ opacity:1; transform:none; }

.pregunta__texto{
  font-family:var(--display);
  font-size:clamp(2.2rem, 11vw, 3.4rem);
  font-weight:400;
  line-height:1.1;
  letter-spacing:-.02em;
  color:var(--crema);
}

.pregunta__botones{
  display:flex;
  gap:1rem;
  flex-wrap:wrap;
  justify-content:center;
}

.stickers-pregunta{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  transition:opacity .7s var(--suave);
}
.stickers-pregunta.visible{ opacity:1; visibility:visible; }
.sticker-pregunta{
  position:absolute;
  width:clamp(2.2rem, 9vw, 4.8rem);
  height:auto;
  object-fit:contain;
  filter:drop-shadow(0 10px 14px rgba(52,26,34,.35));
  animation:flotarSticker 3.5s ease-in-out infinite alternate;
}
@keyframes flotarSticker{
  to{ transform:translateY(-8px) rotate(var(--giro)); }
}

/* ============================================================
   ESTRUCTURA — la carta avanza por "actos"
   ============================================================ */
.escenario{
  position:relative;
  z-index:1;
  width:100%;
  max-width:var(--ancho);
  margin-inline:auto;
  padding-inline:1.6rem;
}

.acto{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:2rem;
  text-align:center;
  padding-block:4rem;
}

/* Solo el primer acto ocupa la pantalla completa al abrir */
.acto--inicio{
  min-height:100svh;
  padding-top:calc(4rem + env(safe-area-inset-top));
}

.acto--cierre{ padding-bottom:calc(5rem + env(safe-area-inset-bottom)); }

.acto[hidden]{ display:none; }

/* ============================================================
   MENSAJE / MÁQUINA DE ESCRIBIR
   ============================================================ */
.mensaje{
  font-family:var(--display);
  font-optical-sizing:auto;
  font-weight:300;
  font-size:clamp(1.35rem, 5.4vw, 1.85rem);
  line-height:1.5;
  letter-spacing:-.01em;
  text-wrap:pretty;
  min-height:10rem;                 /* evita el salto al empezar a escribir */
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:1.1em;
}

.linea{ margin:0; }

/* El saludo inicial, un punto más grande y en crema */
.mensaje--saludo .linea:first-child{
  font-size:1.15em;
  font-weight:400;
  color:var(--crema);
}

/* Cursor parpadeante sobre la línea que se está escribiendo */
.linea.activa::after{
  content:"";
  display:inline-block;
  width:.06em;
  height:1em;
  margin-left:.06em;
  background:var(--rosa);
  vertical-align:-.12em;
  animation:latir .9s steps(2,start) infinite;
}

@keyframes latir{ 50%{ opacity:0; } }

.pista{
  font-size:.78rem;
  letter-spacing:.06em;
  color:var(--durazno);
  opacity:0;
  transition:opacity .6s var(--suave);
}
.pista.visible{ opacity:.45; }

/* ============================================================
   BOTONES
   ============================================================ */
.accion{
  font-family:var(--texto);
  font-size:.95rem;
  font-weight:500;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--crema);
  background:transparent;
  border:1px solid color-mix(in srgb, var(--dorado) 55%, transparent);
  border-radius:100px;
  padding:1.05rem 2.4rem;
  cursor:pointer;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:opacity .9s var(--suave), transform .9s var(--suave),
             background-color .3s ease, border-color .3s ease;
}

.accion.visible{
  opacity:1;
  transform:none;
  pointer-events:auto;
  animation:respirar 3.4s ease-in-out 1s infinite;
}

.accion:hover,
.accion:focus-visible{
  background:color-mix(in srgb, var(--dorado) 16%, transparent);
  border-color:var(--dorado);
}

.accion:focus-visible{ outline:2px solid var(--rosa); outline-offset:4px; }
.accion:active{ transform:scale(.97); }

.accion.oculto{ opacity:0; transform:scale(.94); pointer-events:none; animation:none; }

/* Pulso muy leve: invita a tocar sin gritar */
@keyframes respirar{
  0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--dorado) 28%, transparent); }
  50%    { box-shadow:0 0 0 14px transparent; }
}

/* El "No": una vez que huye, vive suelto sobre la pantalla */
.accion--no{ border-color:color-mix(in srgb, var(--durazno) 32%, transparent); }
.accion--no.visible{ animation:none; }

.accion--no.huye{
  position:fixed;
  margin:0;
  z-index:22;
  transition:left .22s var(--suave), top .22s var(--suave),
             opacity .9s var(--suave), background-color .3s ease, border-color .3s ease;
}

/* ============================================================
   REVELACIÓN Y CUADRÍCULAS 2x2
   ============================================================ */
.revelacion{
  width:100%;
  opacity:0;
  visibility:hidden;
  transform:translateY(16px) scale(.97);
  transition:opacity 1.1s var(--suave), transform 1.1s var(--suave);
}
.revelacion.visible{ opacity:1; visibility:visible; transform:none; }

/* El marco tipo polaroid envuelve la cuadrícula completa */
.cuadricula{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:.55rem;
  padding:.55rem;
  border-radius:var(--curva);
  background:color-mix(in srgb, var(--crema) 12%, transparent);
  border:1px solid color-mix(in srgb, var(--crema) 20%, transparent);
  box-shadow:0 30px 60px -30px var(--sombra);
}

.celda{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:calc(var(--curva) - .4rem);
  background:color-mix(in srgb, var(--noche) 40%, transparent);
}

.celda img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* La firma de la página: cada foto se "revela" como una polaroid,
   con un retardo escalonado para que la cuadrícula despierte en cascada. */
.revelacion.visible .celda img{
  animation:revelar 2.4s var(--suave) both;
  animation-delay:calc(.25s + var(--i) * .22s);
}

@keyframes revelar{
  0%   { filter:brightness(.25) contrast(1.5) saturate(0)   blur(9px); transform:scale(1.06); }
  55%  { filter:brightness(.75) contrast(1.15) saturate(.5) blur(2px); }
  100% { filter:none;                                                  transform:scale(1); }
}

/* Estado de reserva: se ve solo si esa foto todavía no existe */
.reserva{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:.35rem;
  padding:.75rem;
  text-align:center;
  font-size:.72rem;
  line-height:1.4;
  color:color-mix(in srgb, var(--durazno) 70%, transparent);
}
.reserva.visible{ display:flex; }
.reserva code{ font-size:.78rem; color:var(--dorado); }

.pie{
  margin-top:1.1rem;
  font-family:var(--display);
  font-size:1rem;
  font-weight:300;
  font-style:italic;
  color:color-mix(in srgb, var(--durazno) 85%, transparent);
}

/* ============================================================
   DESPEDIDA — un ultimo gesto de amor
   ============================================================ */
.final-amor{
  position:relative;
  width:calc(100% + 3.2rem);
  min-height:30rem;
  margin:4rem -1.6rem 0;
  padding:4rem 1.6rem 3rem;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1.35rem;
  isolation:isolate;
  text-align:center;
  opacity:0;
  transform:translateY(20px) scale(.97);
  transition:opacity 1.1s var(--suave), transform 1.1s var(--suave);
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--brasa) 70%, transparent), transparent 38%),
    linear-gradient(160deg, color-mix(in srgb, var(--noche) 80%, #271323), var(--noche));
  border:1px solid color-mix(in srgb, var(--rosa) 35%, transparent);
  box-shadow:0 30px 70px -30px var(--sombra), inset 0 1px 0 color-mix(in srgb, var(--crema) 18%, transparent);
}
.final-amor.visible{ opacity:1; transform:none; }
.final-amor::before,
.final-amor::after{
  content:"";
  position:absolute;
  z-index:-1;
  width:1px;
  height:1px;
  background:var(--crema);
  box-shadow:8vw 10vh var(--rosa), 20vw 75vh var(--dorado), 79vw 18vh var(--crema),
             91vw 65vh var(--rosa), 68vw 82vh var(--dorado), 31vw 22vh var(--crema);
  opacity:.55;
  animation:brillarFinal 3.5s ease-in-out infinite alternate;
}
.final-amor::before{ top:0; left:0; }
.final-amor::after{ right:0; bottom:0; animation-delay:-1.7s; }
.final-amor__corazon{
  position:absolute;
  z-index:-1;
  width:clamp(10rem, 43vw, 15rem);
  height:clamp(10rem, 43vw, 15rem);
  top:18%;
  left:50%;
  background:color-mix(in srgb, var(--rosa) 15%, transparent);
  filter:blur(1px);
  transform:translateX(-50%) rotate(45deg);
  animation:respirarFinal 3.2s ease-in-out infinite;
}
.final-amor__corazon::before,
.final-amor__corazon::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  border-radius:50%;
  background:inherit;
}
.final-amor__corazon::before{ left:-50%; }
.final-amor__corazon::after{ top:-50%; }
.final-amor__etiqueta{
  color:var(--rosa);
  font-size:.7rem;
  letter-spacing:.3em;
  text-transform:uppercase;
}
.final-amor__titulo{
  max-width:18rem;
  color:var(--crema);
  font-family:var(--display);
  font-size:clamp(2.2rem, 10vw, 3.7rem);
  font-weight:400;
  line-height:1.08;
  text-wrap:pretty;
  text-shadow:0 0 18px color-mix(in srgb, var(--rosa) 70%, transparent);
}
.final-amor__texto{
  max-width:18rem;
  color:var(--durazno);
  font-size:.98rem;
  line-height:1.6;
}
.final-amor__boton{
  position:relative;
  z-index:2;
  opacity:1;
  transform:none;
  pointer-events:auto;
  animation:respirar 3.4s ease-in-out infinite;
}
.final-amor__lluvia{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
}
.corazon-final{
  position:absolute;
  bottom:-2rem;
  width:var(--tam);
  height:var(--tam);
  left:var(--x);
  background:var(--color);
  transform:rotate(45deg);
  filter:drop-shadow(0 0 8px var(--color));
  animation:subirFinal var(--dur) ease-out forwards;
}
.corazon-final::before,
.corazon-final::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  border-radius:50%;
  background:inherit;
}
.corazon-final::before{ left:-50%; }
.corazon-final::after{ top:-50%; }
@keyframes subirFinal{
  0%{ opacity:0; transform:translateY(0) rotate(45deg) scale(.5); }
  15%{ opacity:.95; }
  100%{ opacity:0; transform:translateY(-32rem) rotate(405deg) scale(1); }
}
@keyframes respirarFinal{
  50%{ opacity:.8; transform:translateX(-50%) rotate(45deg) scale(1.08); }
}
@keyframes brillarFinal{ to{ opacity:.18; } }

/* ============================================================
   ACCESIBILIDAD
   ============================================================ */
.solo-lectores{
  position:absolute; width:1px; height:1px;
  overflow:hidden; clip-path:inset(50%); white-space:nowrap;
}

@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto; }
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

<body class="bloqueado">

<canvas id="escena" aria-hidden="true"></canvas>

<!-- ========== PORTAL: candado + pregunta trampa ========== -->
<div class="portal" id="portal">

  <div class="cerradura" id="cerradura">
    <p class="epigrafe">Esto está cerrado</p>

    <div class="candado" id="candado">
      <div class="candado__arco" aria-hidden="true"></div>
      <div class="candado__cuerpo">
        <div class="ruedas" id="ruedas"></div>
      </div>
    </div>

    <p class="pista-clave" id="pistaClave"></p>
  </div>

  <div class="stickers-pregunta" id="stickersPregunta" aria-hidden="true"></div>

  <div class="pregunta" id="pregunta" hidden>
    <h1 class="pregunta__texto">¿Me amas?</h1>
    <div class="pregunta__botones">
      <button class="accion" id="btnSi" type="button">Sí</button>
      <button class="accion accion--no" id="btnNo" type="button">No</button>
    </div>
  </div>

</div>

<div class="particulas" id="particulas" aria-hidden="true"></div>

<!-- ========== LA CARTA ========== -->
<div class="escenario">

  <!-- ACTO 1 ------------------------------------------------ -->
  <section class="acto acto--inicio">
    <p class="epigrafe">Feliz aniversario</p>

const QUIETO = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const pausa  = ms => new Promise(r => setTimeout(r, QUIETO ? 0 : ms));

/* ============================================================
   2. CORAZONES FLOTANDO EN EL FONDO
   Se define ahora, pero no arranca hasta que se abre el portal.
   ============================================================ */
function iniciarFondo(){
  const lienzo = document.getElementById("escena");
  const ctx = lienzo.getContext("2d");
  let corazones = [], ancho = 0, alto = 0;

  /* Los sprites se trazan UNA sola vez. En cada cuadro solo se copian,
     que es lo barato: dibujar curvas por partícula y por cuadro no lo es. */
  function forjar(color){
    const s = document.createElement("canvas");
    const t = 64;
    s.width = s.height = t;
    const c = s.getContext("2d");
    c.translate(t/2, t/2 - 5);
    c.scale(.58, .58);
    c.beginPath();
    c.moveTo(0, 12);
    c.bezierCurveTo(0, -8, -30, -10, -30, 8);
    c.bezierCurveTo(-30, 26, -12, 34, 0, 46);
    c.bezierCurveTo(12, 34, 30, 26, 30, 8);
    c.bezierCurveTo(30, -10, 0, -8, 0, 12);
    c.closePath();
    c.shadowColor = color;
    c.shadowBlur = 12;
    c.fillStyle = color;
    c.fill();
    c.fill();                       // segunda pasada: el halo queda más presente
    return s;
  }

  // Sobre un fondo más claro los corazones necesitan más cuerpo para leerse.
  const sprites = [forjar("#FFD9A6"), forjar("#FFC3BE")];

  function nacer(inicio){
    return {
      x: Math.random() * ancho,
      y: inicio ? Math.random() * alto : alto + 60,
      tam: 14 + Math.random() * 24,
      vy: .12 + Math.random() * .3,
      vaiven: .3 + Math.random() * .8,
      fase: Math.random() * Math.PI * 2,
      giro: (Math.random() - .5) * .35,
      alfa: .26 + Math.random() * .38,
      sprite: sprites[Math.random() < .5 ? 0 : 1]
    };
  }

  function medir(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ancho = window.innerWidth;
    alto  = window.innerHeight;
    lienzo.width  = ancho * dpr;
    lienzo.height = alto  * dpr;
    lienzo.style.width  = ancho + "px";
    lienzo.style.height = alto  + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cantidad = Math.round(Math.min(26, (ancho * alto) / 28000));
    corazones = Array.from({length: cantidad}, () => nacer(true));
  }

  function pintar(){
    ctx.clearRect(0, 0, ancho, alto);

    for (const c of corazones){
      if (!QUIETO){
        c.y -= c.vy;
        c.fase += .006;
        c.x += Math.sin(c.fase) * c.vaiven * .3;
        if (c.y < -70) Object.assign(c, nacer(false));
      }

      /* Se desvanecen al subir: nítidos abajo, casi nada arriba. */
      const desvanecer = Math.max(0, Math.min(1, c.y / (alto * .78)));
      ctx.globalAlpha = c.alfa * desvanecer;

      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.giro + Math.sin(c.fase) * .12);
      ctx.drawImage(c.sprite, -c.tam/2, -c.tam/2, c.tam, c.tam);
      ctx.restore();
    }

    ctx.globalAlpha = 1;
    if (!QUIETO) requestAnimationFrame(pintar);
  }

  medir();
  pintar();

  let temporizador;
  window.addEventListener("resize", () => {
    clearTimeout(temporizador);
    temporizador = setTimeout(() => { medir(); if (QUIETO) pintar(); }, 200);
  });
}

/* ============================================================
   3. PARTÍCULAS (esquirlas del candado y corazones del "Sí")
   ============================================================ */
const capaParticulas = () => document.getElementById("particulas");

/* Esquirlas: el candado reventado */
function lanzarEsquirlas(cx, cy){
  const capa = capaParticulas();
  const colores = ["#F8D3A0", "#FFB9B4", "#FFF9F4"];

  for (let i = 0; i < 26; i++){
    const trozo = document.createElement("span");
    const angulo = Math.random() * Math.PI * 2;
    const fuerza = 90 + Math.random() * 240;
    const lado = 4 + Math.random() * 8;

    trozo.className = "esquirla";
    trozo.style.left = cx + "px";
    trozo.style.top  = cy + "px";
    trozo.style.width  = lado + "px";
    trozo.style.height = lado + "px";
    trozo.style.background = colores[i % colores.length];
    trozo.style.setProperty("--dx", Math.cos(angulo) * fuerza + "px");
    trozo.style.setProperty("--dy", Math.sin(angulo) * fuerza + "px");
    trozo.style.setProperty("--giro", (Math.random() * 720 - 360) + "deg");
    trozo.style.animationDelay = (Math.random() * .12) + "s";

    capa.appendChild(trozo);
  }

  setTimeout(() => capa.replaceChildren(), 1300);
}

/* Corazones: la respuesta correcta */
function explotarCorazones(cx, cy){
  const capa = capaParticulas();
  const colores = ["#FFB9B4", "#F8D3A0", "#FFF9F4", "#FF9AA2"];

  for (let i = 0; i < 34; i++){
    const chispa = document.createElement("span");
    const angulo = Math.random() * Math.PI * 2;
    const fuerza = 110 + Math.random() * 300;
    const lado = 10 + Math.random() * 20;

    chispa.className = "chispa";
    chispa.style.left = cx + "px";
    chispa.style.top  = cy + "px";
    chispa.style.width  = lado + "px";
    chispa.style.height = lado + "px";
    chispa.style.color = colores[i % colores.length];
    chispa.style.setProperty("--dx", Math.cos(angulo) * fuerza + "px");
    // Sesgo hacia arriba: caen menos de lo que suben, y se ve más festivo.
    chispa.style.setProperty("--dy", (Math.sin(angulo) * fuerza - 70) + "px");
    chispa.style.setProperty("--giro", (Math.random() * 120 - 60) + "deg");
    chispa.style.animationDelay = (Math.random() * .25) + "s";

    capa.appendChild(chispa);
  }

  setTimeout(() => capa.replaceChildren(), 2000);
}

   4. EL CANDADO

const digitos = [];   // valor actual de cada rueda

function armarCandado(){
  const ruedas = document.getElementById("ruedas");
  document.getElementById("pistaClave").textContent = CONFIG.pistaClave || "";

  [...CONFIG.clave].forEach((_, i) => {
    digitos[i] = 0;

    rueda.className = "rueda";

    const arriba = document.createElement("button");
    arriba.className = "flecha";
    arriba.type = "button";
    arriba.textContent = "▲";
    arriba.setAttribute("aria-label", "Subir rueda " + (i + 1));

    const cara = document.createElement("span");
    cara.className = "digito";
    cara.textContent = "0";
    cara.setAttribute("role", "img");
    cara.setAttribute("aria-label", "Rueda " + (i + 1) + ": 0");

    const abajo = document.createElement("button");
    abajo.className = "flecha";
    abajo.type = "button";
    abajo.textContent = "▼";
    abajo.setAttribute("aria-label", "Bajar rueda " + (i + 1));

    const girar = paso => {
      digitos[i] = (digitos[i] + paso + 10) % 10;
      cara.textContent = digitos[i];
      cara.setAttribute("aria-label", "Rueda " + (i + 1) + ": " + digitos[i]);

      // Reinicia la animación del saltito aunque ya se estuviera ejecutando.
      cara.classList.remove("gira");
      void cara.offsetWidth;
      cara.classList.add("gira");

      comprobarClave();
    };

    arriba.addEventListener("click", () => girar(1));
    abajo .addEventListener("click", () => girar(-1));
    cara  .addEventListener("click", () => girar(1));   // tocar el número también sube

    rueda.append(arriba, cara, abajo);
    ruedas.appendChild(rueda);
  });
}

let abierto = false;
let musica = null;

function iniciarMusica(){
  if (musica) return;

  musica = new Audio("November_Rain.mp3");

  musica.currentTime = 80;

function comprobarClave(){

/* Primero se destraba el arco, después vuela todo en pedazos. */
function reventarCandado(){
  const candado = document.getElementById("candado");

  candado.classList.add("destrabado");
  cerradura.querySelector(".epigrafe").textContent = "";

  setTimeout(() => {
    const caja = candado.getBoundingClientRect();

    candado.classList.add("estalla");

    setTimeout(() => {
      cerradura.hidden = true;
      mostrarPregunta();
    }, QUIETO ? 0 : 700);
  }, QUIETO ? 0 : 420);
}

function mostrarPregunta(){
  const pregunta = document.getElementById("pregunta");

  prepararEvasivo(btnNo, btnSi);
  btnSi.addEventListener("click", abrirCarta, { once:true });
}

/* El "No" se va a otra parte cada vez que alguien se le acerca. */
function prepararEvasivo(btnNo, btnSi){
  const margen = 12;

  function huir(){
    const caja = btnNo.getBoundingClientRect();

    // La primera vez lo sacamos del flujo, conservando su tamaño y su sitio.
    if (!btnNo.classList.contains("huye")){
      btnNo.style.width  = caja.width  + "px";
      btnNo.style.height = caja.height + "px";
      btnNo.style.left   = caja.left   + "px";
      btnNo.style.top    = caja.top    + "px";
      btnNo.classList.add("huye");
    }

    const maxX = window.innerWidth  - caja.width  - margen;
    const maxY = window.innerHeight - caja.height - margen;
    const zonaSi = btnSi.getBoundingClientRect();

    let x = 0, y = 0;
    // Busca un destino lejos del dedo y que no tape al botón "Sí".
    for (let intento = 0; intento < 24; intento++){
      x = margen + Math.random() * Math.max(0, maxX - margen);
      y = margen + Math.random() * Math.max(0, maxY - margen);

      const lejos = Math.hypot(x - caja.left, y - caja.top) > 120;
      const chocaSi = x < zonaSi.right  + margen && x + caja.width  > zonaSi.left - margen &&
                      y < zonaSi.bottom + margen && y + caja.height > zonaSi.top  - margen;
      if (lejos && !chocaSi) break;
    }

    btnNo.style.left = x + "px";
    btnNo.style.top  = y + "px";
  }

  // Escritorio: escapa antes de que el cursor llegue encima.
  btnNo.addEventListener("mouseenter", huir);

  // Táctil: preventDefault evita que el toque se convierta en click.
  btnNo.addEventListener("touchstart", e => { e.preventDefault(); huir(); }, { passive:false });

  // Redes de seguridad: teclado y cualquier click que igual llegue a colarse.
  btnNo.addEventListener("focus", huir);
  btnNo.addEventListener("click", e => { e.preventDefault(); huir(); });

  // Si gira el teléfono, lo devolvemos dentro de la pantalla.
  window.addEventListener("resize", () => {
    if (!btnNo.classList.contains("huye")) return;
    const caja = btnNo.getBoundingClientRect();
    btnNo.style.left = Math.min(parseFloat(btnNo.style.left), window.innerWidth  - caja.width  - margen) + "px";
    btnNo.style.top  = Math.min(parseFloat(btnNo.style.top),  window.innerHeight - caja.height - margen) + "px";
  });
}

/* ============================================================
   6. ABRIR LA CARTA — todo arranca exactamente aquí
   ============================================================ */
function abrirCarta(){
  const portal = document.getElementById("portal");
  const btnSi  = document.getElementById("btnSi");
  const caja   = btnSi.getBoundingClientRect();

  iniciarMusica();

  // La explosión sale del propio botón que acaba de tocar.
  explotarCorazones(caja.left + caja.width / 2, caja.top + caja.height / 2);

  document.body.classList.remove("bloqueado");

  // El portal espera un momento: primero se ven los corazones.
  setTimeout(() => portal.classList.add("abriendo"), QUIETO ? 0 : 420);
  setTimeout(() => { portal.hidden = true; }, QUIETO ? 0 : 1500);

  iniciarFondo();
  historia();
}

/* ============================================================
   7. MÁQUINA DE ESCRIBIR (reutilizable en los dos textos)
   ============================================================ */
let saltarActual = null;   // completa el bloque que se está escribiendo ahora

function volcar(contenedor, lineas){
  contenedor.innerHTML = "";
  for (const linea of lineas){
    const p = document.createElement("p");
    p.className = "linea";
    p.textContent = linea;
    contenedor.appendChild(p);
  }
}

function escribir(contenedor, lineas){
  return new Promise(resolve => {

    if (QUIETO){ volcar(contenedor, lineas); return resolve(); }

    let listo = false;
    const relojes = [];
    const esperar = ms => new Promise(r => relojes.push(setTimeout(r, ms)));

    function terminar(){
      if (listo) return;
      listo = true;
      relojes.forEach(clearTimeout);
      saltarActual = null;
      resolve();
    }

    saltarActual = () => { volcar(contenedor, lineas); terminar(); };

    (async () => {
      for (const linea of lineas){
        if (listo) return;
        const p = document.createElement("p");
        p.className = "linea activa";
        contenedor.appendChild(p);

        for (const letra of linea){
          if (listo) return;
          p.textContent += letra;
          // Las pausas naturales hacen que se lea como alguien escribiendo, no como un motor.
          const espera = ",;".includes(letra) ? 180
                       : ".!?".includes(letra) ? 320
                       : CONFIG.velocidad;
          await esperar(espera);
        }

        p.classList.remove("activa");
        await esperar(CONFIG.pausaLinea);
      }
      terminar();
    })();
  });
}

/* Tocar la pantalla salta el tipeo. Los botones no cuentan como salto. */
const saltar = e => {
  if (e.target.closest(".accion") || e.target.closest("#portal")) return;
  if (saltarActual) saltarActual();
};
document.addEventListener("click", saltar);
document.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") saltar(e);
});

   8. CUADRÍCULAS DE FOTOS

function armarCuadricula(contenedor, rutas){
  contenedor.innerHTML = "";

  rutas.forEach((ruta, i) => {
    const celda = document.createElement("div");
    celda.className = "celda";
    celda.style.setProperty("--i", i);

    const img = document.createElement("img");
    img.alt = "Un momento con Melanie";
    img.decoding = "async";

    const reserva = document.createElement("div");
    reserva.className = "reserva";
    reserva.innerHTML = "<span>Aquí va</span><code></code>";
    reserva.querySelector("code").textContent = ruta;

    // Si la foto todavía no existe, la celda lo dice en vez de romperse.
    img.addEventListener("error", () => {
      img.style.display = "none";
      reserva.classList.add("visible");
    });
    img.src = ruta;

    celda.append(img, reserva);
    contenedor.appendChild(celda);
  });
}

/* ============================================================

const alTocar = boton => new Promise(r => boton.addEventListener("click", r, { once:true }));

function mostrarBoton(boton){ boton.classList.add("visible"); }

function esconderBoton(boton){

}

function revelar(figura){

}

function revelarFinal(){

function prepararFinal(){

async function historia(){
  const pista  = document.getElementById("pista");
  const acto2  = document.getElementById("acto2");
  const boton1 = document.getElementById("boton1");
  const boton2 = document.getElementById("boton2");

  /* --- Acto 1: texto, botón, primera cuadrícula --- */
  await pausa(1600);           // deja que la explosión de corazones respire
  pista.classList.add("visible");
  await escribir(document.getElementById("mensaje1"), CONFIG.mensaje1);
  pista.classList.remove("visible");
  mostrarBoton(boton1);

  await alTocar(boton1);
  esconderBoton(boton1);
  await pausa(260);
  revelar(document.getElementById("revelacion1"));

  /* --- Acto 2: arranca solo, cuando las fotos ya terminaron de revelarse --- */
  await pausa(3200);
  acto2.hidden = false;
  await escribir(document.getElementById("mensaje2"), CONFIG.mensaje2);
  mostrarBoton(boton2);

  await alTocar(boton2);
  esconderBoton(boton2);
  await pausa(260);
  revelar(document.getElementById("revelacion2"));
  await pausa(1700);
  revelarFinal();
}
